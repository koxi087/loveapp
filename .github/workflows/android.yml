name: Automatikus APK Build és Frissítés

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kód letöltése a repóból
      uses: actions/checkout@v4

    - name: Mappaszerkezet helyreállítása a szerveren
      run: |
        # Létrehozzuk az app mappát a szerveren
        mkdir -p app
        
        # Átmozgatjuk az app-szintű gradle fájlt a helyére
        if [ -f build.gradle.kts ]; then
          mv build.gradle.kts app/
        fi
        
        # Kicsomagoljuk a forráskódot az app mappába
        if [ -f src.zip ]; then
          cd app
          unzip -o ../src.zip
          rm ../src.zip
          cd ..
        fi
        
        # Legenerálunk egy üres, de kötelező felső szintű build fájlt a gyökérbe
        echo 'plugins { alias(libs.plugins.android.application) apply false; alias(libs.plugins.kotlin.android) apply false }' > build.gradle.kts

    - name: Java 17 környezet beállítása
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle futtatási jogok megadása
      run: chmod +x ./gradlew

    - name: APK fájl legenerálása (Debug Build)
      run: ./gradlew assembleDebug

    - name: Kész APK feltöltése a GitHubra letölthetőként
      uses: actions/upload-artifact@v4
      with:
        name: LoveApp-Frissites
        path: app/build/outputs/apk/debug/app-debug.apk
