name: Automatikus APK Build és Frissítés

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kod letoltese
      uses: actions/checkout@v4

    - name: Java kornyezet beallitasa
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle 8.5 beallitasa
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Alap mappak letrehozasa
      run: |
        mkdir -p app

    - name: Forraskod kicsomagolasa
      run: |
        if [ -f src.zip ]; then
          cd app
          unzip -qq -o ../src.zip || true
          cd ..
          rm -f src.zip
        fi

    - name: Konfiguracios fajlok helyreallitasa
      run: |
        if [ -f build.gradle.kts ]; then mv build.gradle.kts app/; fi
        echo 'plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }' > build.gradle.kts

    - name: Hibas build gradle faluiras es helyreallitas
      run: |
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.example.first"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.example.first"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
                testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                vectorDrawables { useSupportLibrary = true }
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
            packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2023.08.0"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended:1.6.1")
        }
        EOF

    - name: APK generalasa
      run: gradle assembleDebug --no-daemon

    - name: APK feltoltese
      uses: actions/upload-artifact@v4
      with:
        name: LoveApp-Frissites
        path: app/build/outputs/apk/debug/app-debug.apk
