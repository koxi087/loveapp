name: Automatikus APK Build és Frissítés

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kod letoltese
      uses: actions/checkout@v4

    - name: Java kornyezet beallitasa
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Alap mappak letrehozasa
      run: |
        mkdir -p app
        mkdir -p gradle/wrapper

    - name: Konfiguracios fajlok helyreallitasa
      run: |
        if [ -f build.gradle.kts ]; then mv build.gradle.kts app/; fi
        echo 'plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }' > build.gradle.kts
        echo -e "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\\\://services.gradle.org/distributions/gradle-8.2-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties

    - name: Forraskod kicsomagolasa
      run: |
        if [ -f src.zip ]; then
          cd app
          unzip -qq -o ../src.zip || true
          cd ..
          rm -f src.zip
        fi

    - name: Gradle indito letoltese
      run: |
        curl -sL https://githubusercontent.com -o gradlew
        chmod +x gradlew

    - name: APK generalasa
      run: ./gradlew assembleDebug --no-daemon

    - name: APK feltoltese
      uses: actions/upload-artifact@v4
      with:
        name: LoveApp-Frissites
        path: app/build/outputs/apk/debug/app-debug.apk
